name: Build Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 pytubefix certifi
    
    - name: Build with PyInstaller
      run: |
        pyinstaller YouTubeDownloader_Windows.spec
    
    - name: Test executable
      run: |
        if (Test-Path "dist/YouTubeDownloader.exe") {
          Write-Host "✓ EXE created successfully"
        } else {
          Write-Error "Build failed - EXE not found"
          exit 1
        }
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-Windows
        path: dist/YouTubeDownloader.exe
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 pytubefix certifi
    
    - name: Build with PyInstaller
      run: |
        pyinstaller YouTubeDownloader_macOS.spec
    
    - name: Create DMG
      run: |
        hdiutil create -volname "YouTube Downloader" -srcfolder dist/YouTubeDownloader.app -ov -format UDZO dist/YouTubeDownloader.dmg
    
    - name: Upload macOS app
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-macOS-app
        path: dist/YouTubeDownloader.app
        retention-days: 30
    
    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-macOS-dmg
        path: dist/YouTubeDownloader.dmg
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 pytubefix certifi
    
    - name: Build with PyInstaller
      run: |
        pyinstaller YouTubeDownloader_Linux.spec
    
    - name: Test executable
      run: |
        if [ -f "dist/YouTubeDownloader" ]; then
          echo "✓ Binary created successfully"
        else
          echo "❌ Build failed"
          exit 1
        fi
    
    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-Linux
        path: dist/YouTubeDownloader
        retention-days: 30

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Add permissions specifically for this job
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          YouTubeDownloader-Windows/YouTubeDownloader.exe
          YouTubeDownloader-macOS-dmg/YouTubeDownloader.dmg
          YouTubeDownloader-Linux/YouTubeDownloader
        body: |
          ## YouTube Downloader Release
          
          ### Downloads:
          - **Windows**: YouTubeDownloader.exe
          - **macOS**: YouTubeDownloader.dmg
          - **Linux**: YouTubeDownloader
          
          ### Requirements:
          **FFmpeg must be installed separately for video merging:**
          
          - **Windows**: Download from [ffmpeg.org](https://ffmpeg.org/download.html) or install via `winget install ffmpeg`
          - **macOS**: Install via Homebrew: `brew install ffmpeg`
          - **Linux**: Install via package manager: `sudo apt install ffmpeg` (Ubuntu/Debian) or `sudo dnf install ffmpeg` (Fedora)
          
          ### GPU Support:
          FFmpeg will automatically use GPU encoding if available:
          - Windows: NVENC (NVIDIA), QSV (Intel), AMF (AMD)
          - macOS: VideoToolbox (Apple Silicon/Intel)
          - Linux: NVENC, VAAPI, QSV
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}